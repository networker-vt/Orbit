# Deploy production dist to gh-pages on every merge/push to main.
# Root cause (2026-10-10 → 2026-10-15): only CI test/build ran on main; no workflow
# pushed gh-pages. Manual `npm run deploy:pages` was last used ~2026-10-10.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel an in-flight main deploy; PRs may cancel superseded runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deploy:
    name: Build and push gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node scripts/check-public-bundle.mjs
          node scripts/check-module-budget.mjs
          node scripts/check-bundle-limits.mjs

      - name: SPA deep-link indexes (HTTP 200) + 404 fallback
        run: |
          set -euo pipefail
          # Directory indexes for willkommen/angebot/legal/werkzeuge/* → HTTP 200.
          # 404.html remains only as a fallback for unknown paths.
          cp dist/index.html dist/404.html
          bash scripts/emit-pages-legal.sh dist
          test -f dist/willkommen/index.html
          test -f dist/angebot/index.html

      - name: Offline SPA (Playwright)
        run: |
          set -euo pipefail
          npx playwright install chromium --with-deps
          npm run test:offline-spa

      - name: Publish to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: networker-vt
          user_email: networker-vt@users.noreply.github.com
          commit_message: "deploy: GitHub Pages ${{ github.sha }}"
